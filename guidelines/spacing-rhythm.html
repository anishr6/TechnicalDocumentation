<!-- @dsCard group="Spacing" viewport="700x300" name="Document rhythm" subtitle="44px above a section, 24px between blocks, 30px inside a card" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:22px 24px;font-family:var(--font-core);background:var(--surface-page);color:var(--text-body);-webkit-font-smoothing:antialiased}.cap{font:400 12px/1.4 var(--font-core);color:var(--text-muted);letter-spacing:.02em}.tok{font:500 11px/1.4 var(--font-mono);color:var(--td-teal-600)}</style></head><body><div style="display:grid;grid-template-columns:1fr 128px;gap:18px;align-items:start">
<div>
<div style="height:44px;background:repeating-linear-gradient(-45deg,var(--td-teal-050),var(--td-teal-050) 5px,#fff 5px,#fff 10px)"></div>
<div style="font:300 32px/1.25 var(--font-core);color:var(--text-heading);margin:0 0 20px">Action Required</div>
<div style="border:1px solid var(--border-card);border-radius:4px;padding:30px;font:400 16px/1.6 var(--font-core)">Bordered card — 30px padding</div>
<div style="height:24px;background:repeating-linear-gradient(-45deg,var(--td-teal-050),var(--td-teal-050) 5px,#fff 5px,#fff 10px)"></div>
<div style="background:var(--surface-note);border-left:4px solid var(--accent-note);padding:22px 26px;font:400 16px/1.6 var(--font-core)">Accent panel — 22px / 26px</div>
</div>
<div style="border-left:1px solid var(--border-rule);padding-left:16px;display:grid;gap:14px">
<div><div class="tok">44px</div><div class="cap">--doc-gap-section</div></div>
<div><div class="tok">30px</div><div class="cap">--doc-pad-card</div></div>
<div><div class="tok">24px</div><div class="cap">--doc-gap-block</div></div>
<div><div class="tok">22px 26px</div><div class="cap">--doc-pad-panel</div></div>
</div>
</div></body></html>
