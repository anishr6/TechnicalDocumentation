<!-- @dsCard group="Brand" viewport="700x330" name="Container anatomy" subtitle="Four container types, distinguished by line rather than shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:22px 24px;font-family:var(--font-core);background:var(--surface-page);color:var(--text-body);-webkit-font-smoothing:antialiased}.cap{font:400 12px/1.4 var(--font-core);color:var(--text-muted);letter-spacing:.02em}.tok{font:500 11px/1.4 var(--font-mono);color:var(--td-teal-600)}</style></head><body><div style="display:grid;grid-template-columns:1fr 150px;gap:14px 20px;align-items:center;font:400 16px/1.6 var(--font-core)">
<div style="border:1px solid var(--border-card);border-radius:4px;background:#fff;padding:18px 22px">Bordered card — the default container</div>
<div><div class="tok">1px #1D7481</div><div class="cap">4px radius · no shadow</div></div>
<div style="background:var(--surface-note);border-left:4px solid var(--accent-note);padding:18px 22px">Accent panel — supporting detail</div>
<div><div class="tok">4px left bar</div><div class="cap">square corners</div></div>
<div style="background:var(--surface-caution);border:1px solid var(--border-caution);border-radius:6px;padding:18px 22px">⚠️ <strong style="font-weight:700;color:var(--text-strong)">Important:</strong> one-sentence caution</div>
<div><div class="tok">1px #E9A83E</div><div class="cap">6px radius — rounder</div></div>
<div style="background:var(--surface-quote);border:1px solid var(--border-card);border-radius:4px;padding:18px 22px;font-style:italic">"Verbatim product copy, italic"</div>
<div><div class="tok">#FEFADE</div><div class="cap">4px radius</div></div>
</div></body></html>
