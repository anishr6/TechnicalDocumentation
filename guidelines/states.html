<!-- @dsCard group="Brand" viewport="700x210" name="Interaction states" subtitle="Links underline on hover; feedback buttons fill teal when chosen" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:22px 24px;font-family:var(--font-core);background:var(--surface-page);color:var(--text-body);-webkit-font-smoothing:antialiased}.cap{font:400 12px/1.4 var(--font-core);color:var(--text-muted);letter-spacing:.02em}.tok{font:500 11px/1.4 var(--font-mono);color:var(--td-teal-600)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
<div><div style="display:flex;flex-direction:column;gap:10px;font:400 17px/1.5 var(--font-core)"><a href="#" style="color:var(--text-link);text-decoration:none">Default link</a><a href="#" style="color:var(--text-link-hover);text-decoration:underline">Hover — darkens, underlines</a></div><div class="cap" style="margin-top:12px;border-top:1px solid var(--border-rule);padding-top:10px">#1D7481 → #0F4F58</div></div>
<div><div style="display:flex;gap:12px;align-items:center"><button style="font:600 16px var(--font-core);background:#fff;color:var(--text-strong);border:1px solid var(--td-ink-400);border-radius:4px;padding:8px 14px">👍 Yes</button><span class="cap">→</span><button style="font:600 16px var(--font-core);background:var(--td-teal-700);color:#fff;border:1px solid var(--td-teal-700);border-radius:4px;padding:8px 14px">👍 Yes</button></div><div class="cap" style="margin-top:12px;border-top:1px solid var(--border-rule);padding-top:10px">180ms ease · no scale, no bounce</div></div>
</div></body></html>
