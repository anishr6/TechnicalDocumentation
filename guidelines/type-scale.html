<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:22px 24px;font-family:var(--font-core);background:var(--surface-page);color:var(--text-body);-webkit-font-smoothing:antialiased}.cap{font:400 12px/1.4 var(--font-core);color:var(--text-muted);letter-spacing:.02em}.tok{font:500 11px/1.4 var(--font-mono);color:var(--td-teal-600)}</style></head><body><div style="display:grid;gap:0">
<div style="display:grid;grid-template-columns:150px 56px 1fr;align-items:baseline;gap:14px;padding:7px 0;"><span class="tok">--size-h1</span><span class="cap">38px</span><span style="font:300 22px/1.3 var(--font-core);color:var(--text-heading)">Section title</span></div><div style="display:grid;grid-template-columns:150px 56px 1fr;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--td-ink-100)"><span class="tok">--size-h2</span><span class="cap">32px</span><span style="font:300 22px/1.3 var(--font-core);color:var(--text-heading)">Section heading</span></div><div style="display:grid;grid-template-columns:150px 56px 1fr;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--td-ink-100)"><span class="tok">--size-h3</span><span class="cap">22px</span><span style="font:300 22px/1.3 var(--font-core);color:var(--text-heading)">Card heading</span></div><div style="display:grid;grid-template-columns:150px 56px 1fr;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--td-ink-100)"><span class="tok">--size-body</span><span class="cap">18px</span><span style="font:400 18px/1.3 var(--font-core);color:var(--text-body)">Body and lists</span></div><div style="display:grid;grid-template-columns:150px 56px 1fr;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--td-ink-100)"><span class="tok">--size-small</span><span class="cap">16px</span><span style="font:600 16px/1.3 var(--font-core);color:var(--text-body)">Chrome and footer</span></div><div style="display:grid;grid-template-columns:150px 56px 1fr;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--td-ink-100)"><span class="tok">--size-code</span><span class="cap">15px</span><span style="font:400 15px/1.3 var(--font-core);color:var(--text-body)">Inline code</span></div><div style="display:grid;grid-template-columns:150px 56px 1fr;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--td-ink-100)"><span class="tok">--size-capti
