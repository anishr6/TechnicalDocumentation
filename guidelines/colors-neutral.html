(--font-core)">ink-100</span><span style="font:400 10px/1.5 var(--font-mono);opacity:.85">#EDF0F0<br><span style="font-family:var(--font-core);opacity:.8">code fill</span></span></div><div style="background:#FFFFFF;color:#2B2B2B;height:120px;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px 10px;box-shadow:inset 0 0 0 1px #DDE1E2;"><span style="font:700 12px/1 var(--font-core)">white</span><span style="font:400 10px/1.5 var(--font-mono);opacity:.85">#FFFFFF<br><span style="font-family:var(--font-core);opacity:.8">page</span></span></div>
