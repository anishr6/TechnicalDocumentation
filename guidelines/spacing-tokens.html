<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:22px 24px;font-family:var(--font-core);background:var(--surface-page);color:var(--text-body);-webkit-font-smoothing:antialiased}.cap{font:400 12px/1.4 var(--font-core);color:var(--text-muted);letter-spacing:.02em}.tok{font:500 11px/1.4 var(--font-mono);color:var(--td-teal-600)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">4</div><div class="cap">1</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">8</div><div class="cap">2</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">12</div><div class="cap">3</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">16</div><div class="cap">4</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">20</div><div class="cap">5</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">24</div><div class="cap">6</div></div><div style="text-align:center"><div style="width:30px;height:30px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">30</div><div class="cap">7</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">40</div><div class="cap">8</div></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--td-teal-700);margin:0 auto"></div><div class="tok" style="margin-top:8px">56</div><div class="cap">9</div></div>
</div>
<div class="cap" style="margin-top:18px;border-top:1px solid var(--border-rule);padding-top:12px">--space-1 … --space-9 · every gap, pad and margin in the format resolves to one of these</div></body></html>
