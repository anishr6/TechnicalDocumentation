<script type="text/babel">
const { SectionHeading, DocCard, AccentPanel, Callout, QuoteBanner, StepCard, TermList, InlineCode } = window.ServiceNowDocumentsDesignSystem_d7be20;
const App = () => (

      <p>When web search is enabled, requests are processed through Google's global infrastructure, which routes traffic to a global data center.</p>

    <StepCard number={1} title="Review Your Policies">
      <p><strong>Action:</strong> Confirm that web search configuration aligns with your governance standards.</p>
      <TermList items={["Does your organization have data residency requirements?","Does your privacy policy allow global processing?"]} />

    <QuoteBanner label="Banner Message:">"One or more of your AI agents use the web search tool that leverages Grounding with Google Search offered under a <a href="#">Global Standard</a> deployment."</QuoteBanner>
